{{define "home.html"}}{{template "base" .}}{{end}}
{{define "title"}}Home — Hearth{{end}}
{{define "content"}}

    <form method="post" action="/verify/resend" style="display:inline">
      <button type="submit" class="linklike">Resend verification email</button>
    </form>
  </div>
{{end}}
<p>The feed will appear here once Phase 1 lands.</p>
{{end}}
