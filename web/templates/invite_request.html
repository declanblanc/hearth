{{define "invite_request.html"}}{{template "base" .}}{{end}}
{{define "title"}}Accept invitation — Hearth{{end}}
{{define "content"}}
<div class="invite-card">
  {{if .SenderPhotoURL}}<img class="invite-photo" src="{{.SenderPhotoURL}}" alt="{{.SenderName}}">{{else}}{{template "avatarfallback" "invite-photo"}}{{end}}
  <h1>{{.SenderName}} invited you to connect</h1>
  <p class="muted">@{{.SenderUsername}}</p>

  <form method="post" action="/i/{{.Token}}/accept">
    <button type="submit">Accept invitation from {{.SenderName}}</button>
  </form>
</div>
{{end}}
