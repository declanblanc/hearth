{{define "signup_check_email.html"}}{{template "base" .}}{{end}}
{{define "title"}}Check your email — Hearth{{end}}
{{define "content"}}
<h1>Check your email</h1>
<p>We sent a verification link to <strong>{{.Email}}</strong>. Open it to finish signing up.</p>
<form method="post" action="/verify/resend">
  <input type="hidden" name="email" value="{{.Email}}">
  <button type="submit">Resend verification email</button>
</form>
{{end}}
