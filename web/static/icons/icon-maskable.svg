<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable variant: same flame, but scaled down (×12) so it stays within the
       central safe zone that Android (and other maskable consumers) may crop to a
       circle/squircle. The background bleeds to all four edges. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="78%">
      <stop offset="0%"  stop-color="#4a2412"/>
      <stop offset="55%" stop-color="#2a190f"/>
      <stop offset="100%" stop-color="#160f09"/>
    </radialGradient>
    <linearGradient id="flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"  stop-color="#ffd79a"/>
      <stop offset="45%" stop-color="#f0934a"/>
      <stop offset="100%" stop-color="#d2521f"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Flame scaled (×12) and centered from its native 24×24 viewBox. -->
  <g transform="translate(112,124) scale(12)">
    <path filter="url(#glow)" fill="#ff9d4d" fill-opacity="0.7"
      d="M12 2c.4 3-1.7 4.6-3.2 6.3C7.2 10 6 11.7 6 14a6 6 0 0 0 12 0c0-1.8-.8-3.2-1.7-4.4-.3 1-1 1.7-2 1.9.8-2.3.2-4.7-2.3-9.5Zm0 18a3 3 0 0 1-3-3c0-1.2.7-2.1 1.5-2.9.2 1 .8 1.7 1.8 1.9-.5-1.4 0-2.7 1.1-3.8.6.8 1.6 1.9 1.6 3.6a3 3 0 0 1-3 3.2Z"/>
    <path fill="url(#flame)"
      d="M12 2c.4 3-1.7 4.6-3.2 6.3C7.2 10 6 11.7 6 14a6 6 0 0 0 12 0c0-1.8-.8-3.2-1.7-4.4-.3 1-1 1.7-2 1.9.8-2.3.2-4.7-2.3-9.5Zm0 18a3 3 0 0 1-3-3c0-1.2.7-2.1 1.5-2.9.2 1 .8 1.7 1.8 1.9-.5-1.4 0-2.7 1.1-3.8.6.8 1.6 1.9 1.6 3.6a3 3 0 0 1-3 3.2Z"/>
  </g>
</svg>
