# Fly.io config for the staging app. Deployed from the `dev` branch by
# .github/workflows/deploy.yml. Mirrors fly.toml except for the app name and
# HEARTH_ENV, which is "staging" so mock data is seeded (see cmd/server/seed.go).
app = "the-hearth-staging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HEARTH_ADDR = ":8080"
  HEARTH_ENV = "staging"
  HEARTH_DB_PATH = "/data/hearth.db"

[mounts]
  source = "hearth_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
