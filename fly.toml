# Fly.io app config. Replace `app` with the real app name after `flyctl launch`.
app = "hearth"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HEARTH_ADDR = ":8080"
  HEARTH_ENV = "production"
  HEARTH_DB_PATH = "/data/hearth.db"

[mounts]
  source = "hearth_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
